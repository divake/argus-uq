[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-uq"
version = "0.1.0"
description = "Uncertainty quantification benchmark for VLM GUI grounding agents."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Divake Kumar"},
    {name = "Sina Tayebati"},
    {name = "Devashri Naik"},
    {name = "Amanda Sofie Rios"},
    {name = "Nilesh Ahuja"},
    {name = "Omesh Tickoo"},
    {name = "Ranganath Krishnan"},
    {name = "Amit Ranjan Trivedi"},
]
keywords = [
    "uncertainty quantification",
    "vision-language models",
    "GUI grounding",
    "computer-use agents",
    "conformal prediction",
    "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Numerics
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
    "pyarrow>=16.0,<26",  # pyarrow 26 requires numpy>=2
    # Configuration
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    # CLI
    "click>=8.1,<9.0",
    "tqdm>=4.66",
    # Image IO (HEDGE / IMG-HEDGE perturbations)
    "pillow>=10.0",
]

[project.optional-dependencies]
# HF transformers path (whitebox open-source VLMs)
whitebox = [
    "torch>=2.2,<3.0",
    "torchvision>=0.17,<1.0",
    "transformers>=4.45",
    "accelerate>=1.0",
    "huggingface-hub>=0.25",
    "opencv-python-headless>=4.9",
]
# Closed-source vendor SDKs
closed = [
    "openai>=1.50",
    "anthropic>=0.40",
    "google-genai>=0.3",
]
# Paper-reproducing scripts
paper = [
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13",
    "jinja2>=3.1",
]
# Hydra config + experiment orchestration
hydra = [
    "hydra-core>=1.3",
]
# Development tooling
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.5",
]
# Documentation
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
# Everything
all = [
    "argus-uq[whitebox,closed,paper,hydra,dev,docs]",
]

[project.scripts]
argus_score = "argus_uq.cli.score:main"
argus_capture = "argus_uq.cli.capture:main"
argus_reproduce = "argus_uq.cli.reproduce:main"
argus_normalize = "argus_uq.cli.normalize:main"

[project.urls]
Homepage = "https://github.com/divake/argus-uq"

[tool.setuptools]
license-files = ["LICENSE", "LICENSE-DATA", "NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argus_uq = ["configs/**/*.yaml", "configs/**/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF"]
ignore = ["E501"]  # selectively allow long lines in prompt files

[tool.ruff.lint.per-file-ignores]
"src/argus_uq/models/qwen25_vl.py" = ["E501"]
"src/argus_uq/models/closed_source/*.py" = ["E501"]
"src/argus_uq/estimators/prompt.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Default deselects slow + GPU + API tests so CI and routine `pytest`
# invocations only exercise the fast unit / integration suite.
# Run live smoke tests explicitly: `pytest -m "slow"` (or override -m).
addopts = "-q --strict-markers -m 'not slow and not needs_gpu and not needs_api'"
markers = [
    "slow: tests that exercise full inference (skipped on CI by default)",
    "needs_gpu: tests that require a CUDA device",
    "needs_api: tests that require closed-source vendor credentials",
]
